trainer:
  batch_size: 64
  micro_batch_size: 32
  epochs: 30
  num_workers: 4
  prefetch_factor: 4
  device: auto
  seed: 42
  market: futures
  mixed_precision: true
  torch_compile: false
  async_checkpoint_writes: true
  train_window_stride: 16
  val_window_stride: 16
  max_train_windows: null
  max_val_windows: null
  log_every: 50
  val_every: 2
  checkpoint_every: 2
  normalizer:
    mode: zscore

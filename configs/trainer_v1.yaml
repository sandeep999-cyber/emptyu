trainer:
  batch_size: 64
  # Per-step batch fed to the model; grads accumulate over batch_size/micro_batch_size
  # steps so the effective batch (and LR schedule) stays 64. Lower to fit small GPUs.
  micro_batch_size: 16
  epochs: 10
  num_workers: 2
  device: auto
  seed: 42
  market: futures
  mixed_precision: true
  # Stride: sampling over frozen stride-1 window set, NOT re-invoking windowing_engine
  train_window_stride: 16
  val_window_stride: 16
  max_train_windows: null
  max_val_windows: null
  log_every: 50
  val_every: 1
  checkpoint_every: 1
  normalizer:
    mode: zscore
